name: Refresh events and publish

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # =====================================================
      # PYTHON
      # =====================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # =====================================================
      # SCRAPER DEPENDENCIES
      # =====================================================
      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 lxml playwright
          python -m playwright install --with-deps chromium


      # =====================================================
      # SCRAPE OFFICIAL SOURCES
      # =====================================================
      - name: Scrape official sources
        run: python scripts/scrape.py


      # =====================================================
      # SAVE NEW EVENT DATABASE
      #
      # This is important.
      # It commits the freshly scraped events.json back
      # into the repository so the NEXT run can compare
      # against this run.
      # =====================================================
      - name: Save event database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/events.json

          if git diff --cached --quiet; then
            echo "No changes to event database."
          else
            git commit -m "Update event database"
            git push
          fi


      # =====================================================
      # CONFIGURE GITHUB PAGES
      # =====================================================
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5


      # =====================================================
      # UPLOAD WEBSITE
      # =====================================================
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .


      # =====================================================
      # DEPLOY WEBSITE
      # =====================================================
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
