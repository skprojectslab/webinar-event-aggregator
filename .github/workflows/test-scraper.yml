
      - name: Check scraper output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/events.json")
          if not path.exists():
              raise SystemExit("FAIL: data/events.json was not created")

          data = json.loads(path.read_text(encoding="utf-8"))

          if isinstance(data, list):
              events = data
          elif isinstance(data, dict):
              events = data.get("events")
              if not isinstance(events, list):
                  print("Top-level JSON keys:", list(data.keys()))
                  raise SystemExit(
                      "FAIL: JSON is an object, but no list was found under 'events'."
                  )
          else:
              raise SystemExit("FAIL: Unexpected JSON structure")

          print(f"PASS: events.json contains {len(events)} records")

          for event in events:
              if not isinstance(event, dict):
                  continue
              title = event.get("title", "")
              url = event.get("event_url", "")
              if (
                  "event round-up" in title.lower()
                  or "event-round-up" in url.lower()
              ):
                  print(f"REVIEW: Possible roundup retained: {title} | {url}")
          PY
