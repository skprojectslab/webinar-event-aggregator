
name: Test EventRadar scraper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-scraper:
    if: github.ref == 'refs/heads/test/event-filter-fix'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 lxml playwright
          python -m playwright install --with-deps chromium

      - name: Run patched scraper
        run: python scripts/scrape.py

     
    
      - name: Check scraper output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/events.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          events = data.get("events")

          if not isinstance(events, list):
              raise SystemExit("FAIL: 'events' is not a list")

          print(f"Total events: {len(events)}")

          for event in events:
              if not isinstance(event, dict):
                  continue

              title = event.get("title", "")
              url = event.get("event_url", "")
              text = f"{title} {url}".lower()

              if any(term in text for term in (
                  "event-round-up",
                  "event-roundup",
                  "blog",
                  "/insights/"
              )):
                  print(f"REVIEW: {title} | {url}")

          print("Validation completed.")
          PY

      - name: Upload test events JSON
        uses: actions/upload-artifact@v4
        with:
          name: test-events-json
          path: data/events.json
          retention-days: 7
