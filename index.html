<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Webinar & Event Aggregator</title>

<style>

/* =====================================================
   BASE
   ===================================================== */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0f172a;
  color:#e2e8f0;
  font-family:Segoe UI,Arial,sans-serif;
}

.wrap{
  max-width:1180px;
  margin:auto;
  padding:20px;
}


/* =====================================================
   HEADER
   ===================================================== */

header{
  background:#111827;
  border-bottom:1px solid #334155;
}

h1{
  margin:0 0 10px 0;
  font-size:32px;
  line-height:1.2;
}

.sub{
  color:#94a3b8;
  font-size:13px;
}


/* =====================================================
   STATISTICS
   ===================================================== */

.stats{
  display:flex;
  gap:10px;
  margin-top:15px;
  flex-wrap:wrap;
}

.stat{
  background:#1e293b;
  border:1px solid #334155;
  padding:12px;
  border-radius:10px;
  min-width:140px;
}

.label{
  font-size:11px;
  color:#94a3b8;
}

.num{
  font-size:21px;
  font-weight:700;
  margin-top:3px;
}


/* =====================================================
   FILTERS
   ===================================================== */

.controls{
  display:grid;
  grid-template-columns:2fr repeat(4,1fr);
  gap:9px;
  margin:18px 0;
  align-items:stretch;
}

input,
select{
  width:100%;
  height:50px;
  padding:10px;
  border-radius:8px;
  border:1px solid #334155;
  background:#0b1220;
  color:#e2e8f0;
  font-family:inherit;
  font-size:14px;
}

input::placeholder{
  color:#64748b;
}

input:focus,
select:focus{
  outline:2px solid #38bdf8;
  outline-offset:1px;
}


/* =====================================================
   DATE PICKER
   ===================================================== */

.date-wrap{
  position:relative;
  width:100%;
}

.date-wrap input[type="date"]{
  padding-right:48px;
  cursor:pointer;
  color:#e2e8f0;
  background:#0b1220;
  color-scheme:dark;
}

/*
   Hide Chrome's native icon visually.
   We use our own clickable button so the calendar
   always has a clear clickable target.
*/

.date-wrap input[type="date"]::-webkit-calendar-picker-indicator{
  opacity:0;
  position:absolute;
  right:0;
  width:45px;
  height:100%;
  cursor:pointer;
}

/* Custom calendar button */

.calendar-button{
  position:absolute;
  top:0;
  right:0;
  width:46px;
  height:50px;
  border:0;
  background:transparent;
  color:#e2e8f0;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:0 8px 8px 0;
  z-index:5;
}

.calendar-button:hover{
  background:#1e293b;
}

.calendar-button:focus{
  outline:2px solid #38bdf8;
  outline-offset:-2px;
}

.calendar-button svg{
  width:20px;
  height:20px;
  stroke:currentColor;
}


/* =====================================================
   EVENT GRID
   ===================================================== */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  gap:13px;
}

.card{
  background:#1e293b;
  border:1px solid #334155;
  border-radius:12px;
  padding:15px;
  min-width:0;
}

.title{
  font-weight:700;
  line-height:1.35;
  font-size:17px;
}

.meta{
  font-size:12px;
  color:#94a3b8;
  margin:8px 0;
  line-height:1.5;
}

.badge{
  display:inline-block;
  background:#38bdf8;
  color:#082f49;
  padding:2px 7px;
  border-radius:999px;
}

.desc{
  font-size:13px;
  line-height:1.45;
  color:#cbd5e1;
}

.links{
  display:flex;
  gap:7px;
  margin-top:12px;
  flex-wrap:wrap;
}

.link{
  color:#67e8f9;
  text-decoration:none;
  border:1px solid #334155;
  padding:7px 9px;
  border-radius:7px;
  font-size:13px;
}

.link:hover{
  background:#0b1220;
}

.empty{
  text-align:center;
  padding:45px;
  color:#94a3b8;
}

.foot{
  color:#64748b;
  font-size:11px;
  margin-top:25px;
}


/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:850px){

  .controls{
    grid-template-columns:1fr 1fr;
  }

  .wide{
    grid-column:1/-1;
  }

}

@media(max-width:600px){

  h1{
    font-size:26px;
  }

  .controls{
    grid-template-columns:1fr;
  }

  .wide{
    grid-column:auto;
  }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
     ===================================================== -->

<header>

<div class="wrap">

<h1>Webinar & Event Aggregator</h1>

<div class="sub">
Official first-party sources only • automatically refreshed by GitHub Actions
</div>


<!-- =====================================================
     STATISTICS
     ===================================================== -->

<div class="stats">

<div class="stat">
<div class="label">Events</div>
<div class="num" id="count">—</div>
</div>


<div class="stat">
<div class="label">Sources</div>
<div class="num" id="sources">—</div>
</div>


<div class="stat">
<div class="label">Upcoming this week</div>
<div class="num" id="week">—</div>
</div>


<div class="stat">
<div class="label">Last updated</div>
<div class="num" id="updated">—</div>
</div>

</div>

</div>

</header>


<!-- =====================================================
     MAIN
     ===================================================== -->

<main class="wrap">


<!-- =====================================================
     FILTERS
     ===================================================== -->

<div class="controls">


<input
  class="wide"
  id="q"
  placeholder="Search events, AI, cloud, webinar..."
>


<select id="source">

<option value="">
All sources
</option>

</select>


<select id="category">

<option value="">
All categories
</option>

<option>
AI & Machine Learning
</option>

<option>
Cloud Computing
</option>

<option>
Cybersecurity
</option>

<option>
Digital Transformation
</option>

<option>
Technology
</option>

</select>


<select id="type">

<option value="">
All types
</option>

<option>
webinar
</option>

<option>
conference
</option>

<option>
workshop
</option>

<option>
seminar
</option>

<option>
meetup
</option>

</select>


<!-- =====================================================
     DATE FILTER
     ===================================================== -->

<div class="date-wrap">

<input
  type="date"
  id="from"
  aria-label="Filter events from date"
>

<button
  type="button"
  class="calendar-button"
  id="calendarButton"
  aria-label="Open calendar"
  title="Open calendar"
>

<svg
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>

<rect
  x="3"
  y="4"
  width="18"
  height="18"
  rx="2"
  ry="2">
</rect>

<line x1="16" y1="2" x2="16" y2="6"></line>
<line x1="8" y1="2" x2="8" y2="6"></line>
<line x1="3" y1="10" x2="21" y2="10"></line>

</svg>

</button>

</div>


</div>


<!-- =====================================================
     EVENTS
     ===================================================== -->

<div id="grid" class="grid"></div>


<div class="foot">

Data is scraped from official source websites.
Event links open the original publisher page.

</div>


</main>


<script>


/* =====================================================
   DATA
   ===================================================== */

let data = [];

let filtered = [];


/* =====================================================
   HELPER
   ===================================================== */

const $ = id =>
  document.getElementById(id);


/* =====================================================
   HTML ESCAPE
   ===================================================== */

const esc = s =>
  String(s ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );


/* =====================================================
   DATE FORMAT
   ===================================================== */

const dt = v => {

  if(!v)
    return "Date not found";

  let d = new Date(v);

  return isNaN(d)
    ? "Date not found"
    : d.toLocaleString(
        undefined,
        {
          weekday:"short",
          year:"numeric",
          month:"short",
          day:"numeric",
          hour:"2-digit",
          minute:"2-digit"
        }
      );

};


/* =====================================================
   RENDER EVENTS
   ===================================================== */

function render(){

  let q = $("q").value.toLowerCase();

  let s = $("source").value;

  let c = $("category").value;

  let t = $("type").value;

  let f = $("from").value;


  filtered = data.filter(e =>

    (!s || e.source_id === s) &&

    (!c || e.category === c) &&

    (!t || e.type === t) &&

    (
      !f ||
      !e.date ||
      e.date.slice(0,10) >= f
    ) &&

    (
      !q ||

      (
        `${e.title} ${e.description} ${e.source_name}`
      )
      .toLowerCase()
      .includes(q)

    )

  );


  $("grid").innerHTML = filtered.length

    ? filtered.map(e => `

      <article class="card">

        <div class="title">
          ${esc(e.title)}
        </div>


        <div class="meta">

          ${esc(dt(e.date))}

          •
          ${esc(e.type)}

          •

          <span class="badge">
            ${esc(e.category)}
          </span>

          <br>

          ${esc(e.source_name)}

        </div>


        <div class="desc">
          ${esc(e.description || "")}
        </div>


        <div class="links">


          <a
            class="link"
            href="${esc(e.event_url || e.source_url)}"
            target="_blank"
            rel="noopener"
          >
            View event ↗
          </a>


          ${
            e.registration_url &&
            e.registration_url !== e.event_url

            ? `

              <a
                class="link"
                href="${esc(e.registration_url)}"
                target="_blank"
                rel="noopener"
              >
                Register ↗
              </a>

            `

            : ""
          }


        </div>


      </article>

    `).join("")

    : `<div class="empty">No matching events.</div>`;

}


/* =====================================================
   LOAD DATA
   ===================================================== */

fetch("data/events.json")

.then(r => r.json())

.then(p => {


  /* ===================================================
     STORE EVENTS
     =================================================== */

  data = p.events || [];


  /* ===================================================
     EVENT COUNT
     =================================================== */

  $("count").textContent = data.length;


  /* ===================================================
     UNIQUE SOURCE COUNT
     =================================================== */

  const uniqueSourceIds = new Set(

    data
      .map(e => e.source_id)
      .filter(Boolean)

  );


  $("sources").textContent =
    uniqueSourceIds.size;


  /* ===================================================
     UPCOMING THIS WEEK
     =================================================== */

  let now = new Date();

  let w = new Date(now);

  w.setDate(

    now.getDate() -
    (now.getDay() || 7) +
    1

  );


  $("week").textContent =

    data.filter(

      e =>
        e.date &&
        new Date(e.date) >= w

    ).length;


  /* ===================================================
     LAST UPDATED
     =================================================== */

  $("updated").textContent =

    p.generated_at

      ? new Date(
          p.generated_at
        ).toLocaleString()

      : "—";


  /* ===================================================
     BUILD UNIQUE SOURCE LIST
     
     One website = one dropdown entry.
     =================================================== */

  const sourceMap = new Map();


  data.forEach(e => {

    const id = e.source_id;

    if(!id)
      return;


    if(!sourceMap.has(id)){

      sourceMap.set(

        id,

        e.source_name || id

      );

    }

  });


  /* ===================================================
     CONVERT TO ARRAY
     =================================================== */

  let sources = Array.from(

    sourceMap.entries()

  );


  /* ===================================================
     TECHUK FIRST
     
     Everything else alphabetical.
     =================================================== */

  sources.sort((a,b) => {


    const aName =
      String(a[1]).toLowerCase();


    const bName =
      String(b[1]).toLowerCase();


    const aTech =

      aName.includes("techuk") ||

      String(a[0])
        .toLowerCase()
        .includes("techuk");


    const bTech =

      bName.includes("techuk") ||

      String(b[0])
        .toLowerCase()
        .includes("techuk");


    if(aTech && !bTech)
      return -1;


    if(!aTech && bTech)
      return 1;


    return aName.localeCompare(
      bName
    );

  });


  /* ===================================================
     POPULATE SOURCE FILTER
     =================================================== */

  const sourceSelect =
    $("source");


  sources.forEach(
    ([id,name]) => {


      const option =
        document.createElement(
          "option"
        );


      option.value = id;


      option.textContent =
        name;


      sourceSelect.appendChild(
        option
      );


    }
  );


  /* ===================================================
     INITIAL RENDER
     =================================================== */

  render();


})


.catch(() => {

  $("grid").innerHTML =
    '<div class="empty">Data file could not be loaded.</div>';

});


/* =====================================================
   FILTER EVENTS
   ===================================================== */

["q","source","category","type","from"]

.forEach(id => {

  $(id).addEventListener(

    id === "q"
      ? "input"
      : "change",

    render

  );

});


/* =====================================================
   CALENDAR BUTTON
   ===================================================== */

/*
   This is the important part.

   Clicking the calendar icon explicitly tells the
   browser to open the native date picker.

   Chrome supports showPicker() for date inputs.
*/

const dateInput =
  $("from");

const calendarButton =
  $("calendarButton");


if(dateInput && calendarButton){

  calendarButton.addEventListener(
    "click",
    function(){

      if(
        typeof dateInput.showPicker ===
        "function"
      ){

        try{

          dateInput.showPicker();

        }
        catch(e){

          /*
             The browser may already have
             opened the picker.
          */

        }

      }

      else{

        dateInput.focus();

      }

    }
  );


  /*
     Clicking anywhere in the date field
     also opens the native picker where
     supported.
  */

  dateInput.addEventListener(
    "click",
    function(){

      if(
        typeof dateInput.showPicker ===
        "function"
      ){

        try{

          dateInput.showPicker();

        }
        catch(e){

        }

      }

    }
  );

}


</script>

</body>

</html>
